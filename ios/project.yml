name: Unlist
options:
  bundleIdPrefix: com.unlist
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Unlist:
    type: application
    platform: iOS
    sources:
      - path: Unlist
      - path: ../brokers.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlist.app
        PRODUCT_NAME: Unlist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Unlist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  UnlistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnlistTests
    dependencies:
      - target: Unlist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.unlist.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Unlist.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Unlist"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Unlist:
    build:
      targets:
        Unlist: all
        UnlistTests: [test]
    test:
      targets:
        - UnlistTests
